{% extends 'base.html' %}
{% block content %}
<div class="delete-order-container">
    <h1>Delete Order</h1>
    <p>Are you sure you want to delete the order for "{{ order.item.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="category_id" value="{{ request.GET.category_id }}">
        <input type="hidden" name="item_id" value="{{ request.GET.item_id }}">
        <button type="submit">Yes, Delete</button>
        <a href="{% if request.GET.category_id and request.GET.item_id %}
        {% url 'market' %}?category_id={{ request.GET.category_id }}&item_id={{ request.GET.item_id }}
        {% else %}
        {% url 'dashboard' %}
        {% endif %}"
        >Cancel</a>
    </form>
</div>
{% if request.user.is_authenticated and request.user.userprofile.theme %}
<style>
    .delete-order-container {
    background-color: #1e1e1e;
    padding: 20px;
    border-radius: 8px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    color: #e0e0e0;
    font-family: Arial, sans-serif;
    margin-top: 100px;
}

.delete-order-container h1 {
    color: #ffffff;
    margin-bottom: 1em;
}

.delete-order-container p {
    color: #cccccc;
    font-size: 1.1em;
}

.delete-order-container form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.delete-order-container button {
    background-color: #2979ff;
    color: #ffffff;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
    transition: background-color 0.3s ease;
}

.delete-order-container button:hover {
    background-color: #5393ff;
}

.delete-order-container a {
    color: #80c1ff;
    text-decoration: none;
    font-size: 1em;
    padding: 10px 15px;
    border-radius: 5px;
    background-color: transparent;
    display: inline-block;
    transition: color 0.3s ease, background-color 0.3s ease;
    text-align: center;
}

.delete-order-container a:hover {
    color: #ffffff;
    background-color: #2979ff;
}

.delete-order-container input[type="hidden"] {
    display: none;
}
</style>
{% else %}
<style>
    .delete-order-container {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 8px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 0 10px rgba(15, 23, 42, 0.1);
    color: #1f2933;
    font-family: Arial, sans-serif;
    margin-top: 100px;
}

.delete-order-container h1 {
    color: #111827;
    margin-bottom: 1em;
}

.delete-order-container p {
    color: #4b5563;
    font-size: 1.1em;
}

.delete-order-container form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.delete-order-container button {
    background-color: #2979ff;
    color: #ffffff;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
    transition: background-color 0.3s ease;
}

.delete-order-container button:hover {
    background-color: #5393ff;
}

.delete-order-container a {
    color: #2563eb;
    text-decoration: none;
    font-size: 1em;
    padding: 10px 15px;
    border-radius: 5px;
    background-color: transparent;
    display: inline-block;
    transition: color 0.3s ease, background-color 0.3s ease;
    text-align: center;
}

.delete-order-container a:hover {
    color: #ffffff;
    background-color: #2563eb;
}

.delete-order-container input[type="hidden"] {
    display: none;
}
</style>
{% endif %}
{% endblock %}
