{% load static %}
<nav class="navbar">
    <div class="nav-menu">
        <div class="nav-brand">
            <img src="{% static 'favicon.ico' %}" alt="favicon" class="nav-profile-img" height="50px" width="50px">
            <span class="nav-brand-name">Community Marketplace</span>
        </div>
        <a href="{% url 'home' %}" class="nav-link">Home</a>
        <a href="{% url 'about' %}" class="nav-link">About</a>
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="nav-link">Dashboard</a>
            <a href="{% url 'profile' %}" class="nav-link">Profile</a>
            <a href="{% url 'market' %}" class="nav-link">Market</a>
            <a href="{% url 'logout' %}" class="nav-link">Logout</a>
            <img src="{{ profile_pic }}" alt="Profile Photo" class="nav-profile-img" height="50px" width="50px">
        {% else %}
            <a href="{% url 'login' %}" class="nav-link">Login</a>
            <a href="{% url 'register' %}" class="nav-link">Register</a>
        {% endif %}
    </div>
</nav>
